spring.application.name=cloud-kitchen-backend

# Postgres connection - set these as environment variables in production (Render, etc.)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cloudkitchen}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Comma-separated list, e.g. https://your-kitchen.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Shared secret for admin-only endpoints (order list, status updates)
app.admin.api-key=${ADMIN_API_KEY:1234}

# Shown to customers on the storefront so they can call in - not a secret.
app.restaurant.phone=${RESTAURANT_PHONE:+91 98765 43210}

# Where uploaded media (hero images, etc.) is stored on disk, and served back from /uploads/**.
app.upload.dir=${UPLOAD_DIR:uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SMTP for admin "new order" / "order delivered" notification emails - see
# EmailNotificationService. Leave MAIL_HOST unset to disable notifications entirely
# (skipped silently, never blocks an order). For Gmail: smtp.gmail.com, port 587,
# username is the full address, password is a 16-character App Password (not your
# normal login password - Gmail requires 2FA enabled to generate one).
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Fallback admin notification address if none is saved in Settings yet.
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:}

# --- Web Push (VAPID) -------------------------------------------------------------
# Notifies the customer that their order is out for delivery even when the tab is closed.
#
# The PRIVATE key is a secret and belongs in an environment variable in any deployed
# environment; the inline default exists so local dev works without setup. With either key
# blank the feature switches itself off completely -- no permission prompt is shown and no
# push is attempted -- rather than prompting the customer and then failing to deliver.
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:BAzAh2E3Auzpwu-GDUlhEi11qbSi-d2h3iVMxxUv2ACgsiXzTwD5UM0JdgjxSAP3IKMl_R0hZfjRDwaa0tjhZIo}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:rWnGdUdHBT_G7B-UutKrjuWt82VLA833BACuwzfURNo}
# RFC 8292 requires a contact the push service can reach about a misbehaving subscription.
app.push.vapid.subject=${VAPID_SUBJECT:mailto:kitchen@example.com}

# --- Behind a reverse proxy (Caddy terminates TLS) -------------------------------
# Caddy serves https and proxies to this app over plain http on localhost:8080, so Tomcat
# sees an http request and ServletUriComponentsBuilder builds "http://..." upload URLs.
# Those URLs are then stored in restaurant settings and menu items, and the browser BLOCKS
# them as mixed content when the page itself is https -- the image 404s to the user while
# serving perfectly well over https.
#
# FRAMEWORK makes Spring honour Caddy's X-Forwarded-Proto/Host, so generated URLs match the
# scheme the customer actually used.
server.forward-headers-strategy=framework
