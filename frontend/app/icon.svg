<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Microgreen sprout: two seed leaves on a stem, on the pale leaf background taken from the
    app's own palette (leaf-pale #e1f5e8, sprout #1fa463, sprout-dark #167a48), so the tab
    icon reads as the same brand as the page rather than a separate mark.

    Drawn at 64x64 with deliberately heavy strokes. A favicon is displayed at 16x16, where
    the thin 2px strokes of the in-app SproutIcon vanish completely.
  -->
  <rect width="64" height="64" rx="14" fill="#e1f5e8"/>
  <g stroke="#167a48" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 52V30" fill="none"/>
    <path d="M32 30C32 18 24 14 13 14c0 12 7 18 19 16Z" fill="#1fa463"/>
    <path d="M32 30c0-11 8-16 19-16 0 11-6 17-19 16Z" fill="#1fa463"/>
  </g>
</svg>
